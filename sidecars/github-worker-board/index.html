<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Worker Board</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <div class="board-container">
    <!-- Header -->
    <header class="board-header">
      <div class="header-main">
        <div class="header-title-row">
          <span class="board-icon">⚡</span>
          <h1 id="board-title" class="board-title">GitHub Worker Board</h1>
          <span id="repo-badge" class="badge repo-badge" style="display: none;"></span>
        </div>
        <div class="header-actions">
          <button id="change-repo-btn" class="icon-btn" title="Change Target Repository" style="display: none;">
            <svg viewBox="0 0 16 16" width="13" height="13">
              <path fill="currentColor" d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25a1.75 1.75 0 0 1 .445-.758l8.61-8.61zm1.414 1.06a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354l-1.086-1.086zM9.75 4.81l-6.97 6.97-.62 2.17 2.17-.619 6.97-6.97-1.55-1.55z"/>
            </svg>
          </button>
          <div class="refresh-controls">
            <span id="countdown-timer" class="countdown-timer" title="Time remaining until next automatic refresh">30s</span>
            <button id="refresh-btn" class="icon-btn" title="Refresh Issues">
              <svg class="refresh-icon" viewBox="0 0 16 16" width="14" height="14">
                <path fill="currentColor" d="M8 3a5 5 0 0 0-4.546 2.914.5.5 0 0 1-.908-.418A6 6 0 0 1 14 8c0 3.314-2.686 6-6 6A6 6 0 0 1 2.086 9.454a.5.5 0 1 1 .908-.418A5 5 0 0 0 8 13a5 5 0 1 0 0-10zm-3 1.5a.5.5 0 0 1 .5.5v2.5a.5.5 0 0 1-.5.5H2.5a.5.5 0 0 1 0-1H4.3A5.02 5.02 0 0 1 5 4.5z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="header-toolbar">
        <div class="search-box">
          <input type="text" id="filter-input" placeholder="Filter issues or PRs..." autocomplete="off" />
        </div>
      </div>
      <div id="filter-chips-container" class="filter-chips-container" style="display: none;"></div>
      <div id="status-bar" class="status-bar">
        <span id="last-updated-text">Loading issues...</span>
      </div>
    </header>

    <!-- Error message banner -->
    <div id="error-banner" class="error-banner" style="display: none;">
      <span id="error-message"></span>
      <button id="retry-btn" class="retry-btn">Retry</button>
    </div>

    <!-- Repository prompt dialog (when outside git repo or gh repo view fails) -->
    <div id="repo-prompt-banner" class="repo-prompt-banner" style="display: none;">
      <div class="prompt-content">
        <div class="prompt-title">Target Repository Required</div>
        <div class="prompt-desc">No git repository detected in the current workspace. Enter the GitHub repository (<code>owner/repo</code>) to view:</div>
        <form id="repo-form" class="repo-form">
          <input type="text" id="repo-input" placeholder="e.g. facebook/react" autocomplete="off" required />
          <button type="submit" class="submit-btn">Load Issues</button>
        </form>
      </div>
    </div>

    <!-- Stacked Horizontal Cards View -->
    <main id="cards-container" class="cards-container">
      <div class="skeleton-loader">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
